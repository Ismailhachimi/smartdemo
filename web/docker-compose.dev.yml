# Development: the whole stack in Docker, with live reload.
#
#   cp .env.example .env              # set APP_SECRET (openssl rand -hex 32)
#   docker compose -f docker-compose.dev.yml up
#
# Web app on http://localhost:${WEB_PORT}, API on http://localhost:${API_PORT}.
# Your checkout is mounted into the container: saving a file reloads the API or the page.
# Sign-in links and other emails are printed in this output while RESEND_API_KEY is empty.
#
# Local S3 instead of the media volume:
#   STORAGE_DRIVER=s3 in .env, then: docker compose -f docker-compose.dev.yml --profile s3 up

name: smartdemo-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartdemo
      POSTGRES_PASSWORD: smartdemo
      POSTGRES_DB: smartdemo
    ports:
      - "127.0.0.1:5433:5432" # for database tools on your machine
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdemo -d smartdemo"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Read by the apps on top of .env; these win.
      DATABASE_URL: postgres://smartdemo:smartdemo@db:5432/smartdemo
      APP_URL: ${APP_URL:-http://localhost:3000}
      WEB_PORT: ${WEB_PORT:-3000}
      API_PORT: ${API_PORT:-4000}
      STORAGE_DIR: /data
      S3_BUCKET: ${S3_BUCKET:-smartdemo}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smartdemo}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smartdemo-dev-secret}
      npm_config_store_dir: /pnpm-store # pnpm cache in a volume, not in your checkout
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    volumes:
      - .:/app
      # Linux dependencies and build caches stay in volumes, out of your checkout.
      - node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - db_node_modules:/app/packages/db/node_modules
      - emails_node_modules:/app/packages/emails/node_modules
      - next_cache:/app/apps/web/.next
      - pnpm_store:/pnpm-store
      - media-dev:/data

  # Local S3-compatible storage (SeaweedFS), only with --profile s3.
  s3:
    image: chrislusf/seaweedfs:4.55
    profiles: [s3]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-smartdemo}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-smartdemo-dev-secret}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"smartdemo","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - s3data-dev:/data

volumes:
  pgdata-dev:
  media-dev:
  s3data-dev:
  node_modules:
  api_node_modules:
  web_node_modules:
  db_node_modules:
  emails_node_modules:
  next_cache:
  pnpm_store:
