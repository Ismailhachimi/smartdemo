# SmartDemo server: Postgres + API (NestJS) + web (Next.js) behind a single Caddy entrypoint.
#
#   cp .env.example .env    # then fill APP_SECRET and POSTGRES_PASSWORD
#   docker compose up -d --build
#
# Everything is served on one URL (APP_URL): /api/* goes to the API, the rest to the web app.

name: smartdemo

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartdemo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-smartdemo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartdemo}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env (openssl rand -hex 32)}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-4096}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-}
      STORAGE_DIR: /data
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-smartdemo}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-SmartDemo <onboarding@resend.dev>}
      EMAIL_LOG: ${EMAIL_LOG:-}
    volumes:
      - media:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:8080}
      API_INTERNAL_URL: http://api:4000

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
  media:
