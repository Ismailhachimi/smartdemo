# SmartDemo server: Postgres + API (NestJS) + web (Next.js) behind a single Caddy entrypoint.
#
#   cp .env.example .env    # then fill APP_SECRET and POSTGRES_PASSWORD
#   docker compose up -d --build
#
# Everything is served on one URL (APP_URL): /api/* goes to the API, the rest to the web app.
# Videos go to the `media` volume by default. To keep them in the bundled S3 server instead
# (SeaweedFS), set STORAGE_DRIVER=s3, S3_ENDPOINT=http://s3:8333 and S3 keys in .env, then:
#   docker compose --profile s3 up -d --build

name: smartdemo

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartdemo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartdemo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-smartdemo}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-smartdemo}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env (openssl rand -hex 32)}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-4096}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-}
      STORAGE_DIR: /data
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-smartdemo}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-SmartDemo <onboarding@resend.dev>}
      EMAIL_LOG: ${EMAIL_LOG:-}
      STREAMING: ${STREAMING:-auto}
      STREAM_CONCURRENCY: ${STREAM_CONCURRENCY:-1}
    volumes:
      - media:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:8080}
      API_INTERNAL_URL: http://api:4000

  # S3-compatible storage on the same server (SeaweedFS), only with --profile s3.
  s3:
    image: chrislusf/seaweedfs:4.55
    profiles: [s3]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -n "$$S3_ACCESS_KEY_ID" ] && [ -n "$$S3_SECRET_ACCESS_KEY" ] || { echo "Set S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY in .env"; exit 1; }
        printf '{"identities":[{"name":"smartdemo","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - s3data:/data

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata:
  media:
  s3data:
